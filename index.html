  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const canvas = $('race-canvas'), ctx = canvas.getContext('2d');
    const targets = [300,360,420];
    const state = {phase:'ready',level:1,distance:0,scores:[0,0],names:['Pemain 1','Pemain 2'],lanes:[1,1],objects:[],spawnTime:0,stripes:0,sound:true,audio:null,last:0,questionIndex:0};
    let width=0,height=430;

    function resize(){
      width=canvas.clientWidth;height=canvas.clientHeight;
      const ratio=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
      ctx.setTransform(ratio,0,0,ratio,0,0);draw();
    }
    function tone(freq){
      if(!state.sound)return;
      try{
        state.audio ||= new (window.AudioContext||window.webkitAudioContext)();
        if(state.audio.state==='suspended')state.audio.resume();
        const osc=state.audio.createOscillator(),gain=state.audio.createGain(),t=state.audio.currentTime;
        osc.type='sine';osc.frequency.setValueAtTime(freq,t);
        osc.frequency.exponentialRampToValueAtTime(freq*1.3,t+.12);
        gain.gain.setValueAtTime(.07,t);gain.gain.exponentialRampToValueAtTime(.001,t+.18);
        osc.connect(gain).connect(state.audio.destination);osc.start(t);osc.stop(t+.19);
      }catch(_){}
    }
    function victorySound(){
      if(!state.sound)return;
      [523,659,784,1047].forEach((freq,i)=>setTimeout(()=>{if(state.phase==='finished')tone(freq)},i*155));
    }
    function hud(){
      $('level-value').textContent=state.level+' / 3';
      $('distance-value').textContent=Math.min(Math.floor(state.distance),targets[state.level-1])+' / '+targets[state.level-1]+' m';
      $('score-one').textContent=state.scores[0];$('score-two').textContent=state.scores[1];
      $('player-one-name').textContent=state.names[0]+' · A / D';
      $('player-two-name').textContent=state.names[1]+' · ← / →';
    }
    function beginLevel(){
      state.distance=0;state.objects=[];state.spawnTime=0;state.stripes=0;state.lanes=[1,1];state.phase='playing';
      $('quiz-overlay').classList.add('hidden');$('quiz-overlay').classList.remove('flex');
      $('start-overlay').classList.add('hidden');
      $('end-overlay').classList.add('hidden');$('end-overlay').classList.remove('flex');
      $('status-value').textContent='Level '+state.level+' berlangsung';
      $('pause-label').classList.remove('hidden');$('resume-label').classList.add('hidden');
      $('pause-button').setAttribute('aria-label','Jeda permainan');
      hud();tone(440);
    }
    function steer(player,direction){
      if(state.phase!=='playing')return;
      const next=Math.max(0,Math.min(2,state.lanes[player]+direction));
      if(next!==state.lanes[player]){state.lanes[player]=next;tone(300)}
    }
    function spawn(){
      for(let player=0;player<2;player++)state.objects.push({
        player,lane:Math.floor(Math.random()*3),
        type:Math.random()<(.37+state.level*.04)?'cone':'coin',y:-25,hit:false
      });
    }
    function showQuestion(){
      document.querySelectorAll('.quiz-question').forEach((el,i)=>el.classList.toggle('hidden',i!==state.questionIndex));
      $('question-progress').textContent='Soal '+(state.questionIndex%2+1)+' dari 2 · Level '+state.level;
      $('quiz-wrong').classList.add('hidden');$('quiz-correct-panel').classList.add('hidden');
      ['next-question-button','continue-button','results-button'].forEach(id=>$(id).classList.add('hidden'));
      const first=$('question-'+(state.questionIndex+1)).querySelector('button');
      first.focus();
    }
    function quiz(){
      state.phase='quiz';state.questionIndex=(state.level-1)*2;
      $('status-value').textContent='Tantangan kuis level '+state.level;
      $('quiz-overlay').classList.remove('hidden');$('quiz-overlay').classList.add('flex');
      showQuestion();tone(680);
    }
    function celebrate(){
      const area=$('confetti');area.replaceChildren();
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const colors=['#ffcb58','#ffffff','#38c6d8','#f07540'];
      for(let i=0;i<42;i++){
        const piece=document.createElement('i');
        piece.style.setProperty('--x',((i*67.37)%100)+'%');
        piece.style.setProperty('--piece',colors[i%colors.length]);
        piece.style.setProperty('--duration',(2.2+(i%7)*.24)+'s');
        piece.style.setProperty('--delay',((i*13)%19)*-.17+'s');
        area.appendChild(piece);
      }
    }
    function finish(){
      state.phase='finished';
      $('quiz-overlay').classList.add('hidden');$('quiz-overlay').classList.remove('flex');
      const [a,b]=state.scores;
      $('winner-name').textContent=a===b?state.names[0]+' & '+state.names[1]:state.names[a>b?0:1];
      $('finish-result').textContent=state.names[0]+': '+a+' peluang · '+state.names[1]+': '+b+' peluang. '+(a===b?'Hasil seri!':'Juara balapan!');
      $('end-overlay').classList.remove('hidden');$('end-overlay').classList.add('flex');
      $('status-value').textContent='Tiga level selesai!';
      celebrate();victorySound();$('restart-button').focus();
    }
    function laneCenter(player,lane){
      const half=width/2,roadW=half*.78;
      return player*half+(half-roadW)/2+roadW*(lane+.5)/3;
    }
    function road(player){
      const half=width/2,left=player*half;
      ctx.save();ctx.beginPath();ctx.rect(left,0,half,height);ctx.clip();
      const sky=ctx.createLinearGradient(0,0,0,height);
      sky.addColorStop(0,'#ad796d');sky.addColorStop(.38,'#55636a');sky.addColorStop(1,'#263b43');
      ctx.fillStyle=sky;ctx.fillRect(left,0,half,height);
      ctx.fillStyle='#647064';ctx.fillRect(left,height*.18,half,height*.82);
      const roadW=half*.78,roadX=left+(half-roadW)/2;
      ctx.fillStyle='#29333b';ctx.fillRect(roadX,0,roadW,height);
      ctx.fillStyle='#e7b75c';ctx.fillRect(roadX+3,0,3,height);ctx.fillRect(roadX+roadW-6,0,3,height);
      ctx.fillStyle='#f1e5cb';
      for(let i=1;i<3;i++)for(let y=(state.stripes%52)-52;y<height;y+=52)ctx.fillRect(roadX+roadW*i/3-2,y,4,25);
      ctx.restore();
    }
    function drawCar(x,y,player){
      const w=Math.max(21,Math.min(38,width/18));
      ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#111920';
      ctx.fillRect(-w*.62,-20,w*.19,13);ctx.fillRect(w*.43,-20,w*.19,13);
      ctx.fillRect(-w*.62,14,w*.19,13);ctx.fillRect(w*.43,14,w*.19,13);
      ctx.fillStyle=player===0?'#f0b72f':'#38c6d8';ctx.fillRect(-w/2,-29,w,59);
      ctx.fillStyle='#243d50';ctx.fillRect(-w*.36,-15,w*.72,25);
      ctx.fillStyle='#fff1c8';ctx.fillRect(-w*.38,-28,w*.22,5);ctx.fillRect(w*.16,-28,w*.22,5);
      ctx.fillStyle='#ef514b';ctx.fillRect(-w*.38,25,w*.22,5);ctx.fillRect(w*.16,25,w*.22,5);
      ctx.restore();
    }
    function draw(){
      if(!width)return;
      ctx.clearRect(0,0,width,height);road(0);road(1);
      ctx.fillStyle='#ffcb58';ctx.fillRect(width/2-2,0,4,height);
      for(const obj of state.objects){
        if(obj.hit)continue;
        ctx.save();ctx.translate(laneCenter(obj.player,obj.lane),obj.y);
        if(obj.type==='coin'){
          ctx.fillStyle='#ffcb58';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle='#fff0ba';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.stroke();
        }else{
          ctx.fillStyle='#f07540';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,13);ctx.lineTo(14,13);ctx.closePath();ctx.fill();
          ctx.fillStyle='#f6dcc1';ctx.fillRect(-15,11,30,5);
        }
        ctx.restore();
      }
      drawCar(laneCenter(0,state.lanes[0]),height-105,0);
      drawCar(laneCenter(1,state.lanes[1]),height-105,1);
    }
    function tick(now){
      requestAnimationFrame(tick);
      const dt=Math.min((now-(state.last||now))/1000,.05);state.last=now;
      if(state.phase==='playing'){
        const speed=170+state.level*37;
        state.distance+=dt*(17+state.level*4);state.stripes+=dt*speed;state.spawnTime+=dt;
        if(state.spawnTime>Math.max(.55,1.04-state.level*.12)){state.spawnTime=0;spawn()}
        for(const obj of state.objects){
          obj.y+=speed*dt;
          if(!obj.hit&&Math.abs(obj.y-(height-105))<22&&obj.lane===state.lanes[obj.player]){
            obj.hit=true;state.scores[obj.player]=Math.max(0,state.scores[obj.player]+(obj.type==='coin'?1:-1));
            tone(obj.type==='coin'?780:170);
          }
        }
        state.objects=state.objects.filter(o=>o.y<height+30);
        hud();if(state.distance>=targets[state.level-1])quiz();
      }
      draw();
    }

    $('start-form').addEventListener('submit',e=>{
      e.preventDefault();
      state.names=[$('name-one').value.trim()||'Pemain 1',$('name-two').value.trim()||'Pemain 2'];
      state.level=1;state.scores=[0,0];beginLevel();
    });
    $('restart-button').addEventListener('click',()=>{
      state.phase='ready';state.distance=0;state.objects=[];state.level=1;state.scores=[0,0];
      $('end-overlay').classList.add('hidden');$('end-overlay').classList.remove('flex');
      $('confetti').replaceChildren();$('start-overlay').classList.remove('hidden');
      $('status-value').textContent='Siap melaju';hud();$('name-one').focus();
    });
    $('next-question-button').addEventListener('click',()=>{state.questionIndex++;showQuestion()});
    $('continue-button').addEventListener('click',()=>{state.level++;beginLevel()});
    $('results-button').addEventListener('click',finish);
    $('p1-left').addEventListener('click',()=>steer(0,-1));
    $('p1-right').addEventListener('click',()=>steer(0,1));
    $('p2-left').addEventListener('click',()=>steer(1,-1));
    $('p2-right').addEventListener('click',()=>steer(1,1));
    $('pause-button').addEventListener('click',()=>{
      if(state.phase==='playing'){
        state.phase='paused';$('status-value').textContent='Balapan dijeda';
        $('pause-label').classList.add('hidden');$('resume-label').classList.remove('hidden');
        $('pause-button').setAttribute('aria-label','Lanjutkan permainan');
      }else if(state.phase==='paused'){
        state.phase='playing';$('status-value').textContent='Level '+state.level+' berlangsung';
        $('pause-label').classList.remove('hidden');$('resume-label').classList.add('hidden');
        $('pause-button').setAttribute('aria-label','Jeda permainan');
      }
    });
    $('sound-button').addEventListener('click',()=>{
      state.sound=!state.sound;
      $('sound-on-label').classList.toggle('hidden',!state.sound);
      $('sound-off-label').classList.toggle('hidden',state.sound);
      $('sound-button').setAttribute('aria-pressed',String(state.sound));
      $('sound-button').setAttribute('aria-label',state.sound?'Matikan suara':'Nyalakan suara');
      if(state.sound)tone(540);
    });
    document.querySelectorAll('.quiz-question').forEach(question=>{
      question.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
        if(state.phase!=='quiz'||!$('quiz-correct-panel').classList.contains('hidden'))return;
        const correct=button.dataset.choice===question.dataset.answer;
        $('quiz-wrong').classList.toggle('hidden',correct);
        if(correct){
          $('quiz-correct-panel').classList.remove('hidden');tone(780);
          const next=state.questionIndex%2===0?$('next-question-button'):state.level===3?$('results-button'):$('continue-button');
          next.classList.remove('hidden');next.focus();
        }else tone(170);
      }));
    });
    window.addEventListener('keydown',e=>{
      if(e.target instanceof HTMLInputElement)return;
      if(state.phase!=='playing'&&state.phase!=='paused')return;
      if(['a','A','d','D','ArrowLeft','ArrowRight',' '].includes(e.key)){
        if(e.target.tagName!=='BUTTON')e.preventDefault();
        if(e.repeat)return;
        if(e.key==='a'||e.key==='A')steer(0,-1);
        if(e.key==='d'||e.key==='D')steer(0,1);
        if(e.key==='ArrowLeft')steer(1,-1);
        if(e.key==='ArrowRight')steer(1,1);
        if(e.key===' '&&e.target.tagName!=='BUTTON')$('pause-button').click();
      }
    });
    window.addEventListener('resize',resize);
    resize();hud();requestAnimationFrame(tick);
  })();
  </script>
 </body>
</html>
